theme: jekyll-theme-primer
url: "https://ponchoalv.github.io"
baseurl: ""
permalink: /posts/:title.html

plugins:
 - jekyll-relative-links
 - jekyll-titles-from-headings

defaults:
 - scope:
     path: ""
     type: posts
   values:
     layout: default

titles_from_headings:
  collections: true
  strip_title: false

relative_links:
  enabled: true
  collections: true
include:
  - CONTRIBUTING.md
  - README.md
  - LICENSE.md
  - COPYING.md
  - CODE_OF_CONDUCT.md
  - ISSUE_TEMPLATE.md
  - PULL_REQUEST_TEMPLATE.md
